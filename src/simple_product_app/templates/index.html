<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Products</title>
  </head>
  <body>
    <main>
      <h1>Products</h1>
      <form method="post">
        <label for="name">Name</label>
        <input id="name" name="name" required>
        <button type="submit">Create product</button>
      </form>
      {% if products %}
        <ul>
          {% for product in products %}
            <li>{{ product.name }}</li>
          {% endfor %}
        </ul>
      {% else %}
        <p>No products yet.</p>
      {% endif %}
    </main>
  </body>
</html>
