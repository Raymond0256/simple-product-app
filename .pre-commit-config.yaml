# Run `poetry run pre-commit install` once. These checks then run on every commit.
# Every hook runs through Poetry, so each tool's version is pinned in poetry.lock
# and pre-commit never installs anything itself.
repos:
  - repo: local
    hooks:
      - id: check-yaml
        name: check yaml
        entry: poetry run check-yaml
        language: system
        types: [yaml]
      - id: check-toml
        name: check toml
        entry: poetry run check-toml
        language: system
        types: [toml]
      - id: end-of-file-fixer
        name: fix end of files
        entry: poetry run end-of-file-fixer
        language: system
        types: [text]
      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: poetry run trailing-whitespace-fixer
        language: system
        types: [text]
      - id: isort
        name: isort
        entry: poetry run isort
        language: system
        types: [python]
      - id: black
        name: black
        entry: poetry run black
        language: system
        types: [python]
      - id: flake8
        name: flake8
        entry: poetry run flake8
        language: system
        types: [python]
      - id: pytest
        name: pytest
        entry: poetry run pytest --cov
        language: system
        pass_filenames: false
        always_run: true
